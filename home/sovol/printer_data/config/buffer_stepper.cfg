#####################################################################
# Mellow FLY-LLL Plus Filament Buffer & MDM Integration
# Replaces stock Sovol CAN buffer with autonomous Mellow FLY-LLL Plus
#####################################################################

# -------------------------------------------------------------------
# Filament Runout & Clog Sensor (via Mellow Buffer SIGNAL output)
# -------------------------------------------------------------------
# Connect the Mellow Buffer SIGNAL pin to your chosen mainboard pin (default: PD6)
# and Buffer GND to mainboard GND.
# The Mellow MDM handles both runout (switch) and clog/tangle (optical encoder)
# and pulls the SIGNAL line LOW on any fault.
[filament_switch_sensor filament_sensor]
switch_pin: ^PD6                  # SV08 Max mainboard unused X-limit port (PD6, GND, 5V)
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    PAUSE
    {action_respond_info("Filament runout or clog detected by Mellow Buffer/MDM!")}
insert_gcode:
    {action_respond_info("Filament detected in Mellow Buffer.")}

# -------------------------------------------------------------------
# Compatibility Shims & Fallbacks for Sovol Stock Macros
# (UNLOAD_FILAMENT, FILAMENT_CHANGE, RESUME, START_PRINT)
# -------------------------------------------------------------------

[gcode_macro BUFFER_STEPPER]
description: Compatibility dummy macro for legacy Sovol buffer motor commands
gcode:
    # No-op: Mellow FLY-LLL Plus buffer feeds and retracts autonomously via mechanical tension

[gcode_macro BUFFER_LONG_UNLOAD_FILAMENT]
description: Compatibility shim for filament unloading
gcode:
    UNLOAD_FILAMENT
    {action_respond_info("Use the physical unload button on the Mellow Buffer to retract remaining filament.")}

[gcode_macro MANUAL_FEED]
description: Compatibility shim for manual feed calls
gcode:
    # No-op: Managed via Mellow Buffer tension arm and physical feed button

[gcode_macro NOZZLE_CLOG_CHECK]
description: Compatibility shim for clog check calls
variable_extrusion_start: 0
variable_time_start: 0
gcode:
    # No-op: Blockage and tangle detection is handled directly in hardware by the Mellow MDM + FLY-LLL Plus Buffer

[gcode_macro CHECK_FILAMENT_STATUS]
description: Compatibility shim for startup filament check
gcode:
    # No-op: Status actively managed by Mellow Buffer and filament_switch_sensor

# Intercept legacy buffer LED SET_PIN commands from Sovol macros (START_PRINT, RESUME)
[gcode_macro SET_PIN]
rename_existing: _REAL_SET_PIN
gcode:
    {% if params.PIN in ['red_led', 'blue_led', 'green_led'] %}
        # Ignore legacy Sovol buffer LED commands (no longer on buffer_mcu)
    {% else %}
        _REAL_SET_PIN {rawparams}
    {% endif %}

# Legacy Sovol state variables preserved for macros that inspect or reset them
[gcode_macro variables]
variable_stop_feeding: False
variable_is_manual_feeding: False
variable_plug_status: False
variable_winding_status: False
variable_clog_retry: False
gcode:
